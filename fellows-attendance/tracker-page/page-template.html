<style>
/* Layout: one narrow column — header, month grid, list of talks; details in a short bottom card */
:root {
  --bg: #f6f4ef; --card: #ffffff; --ink: #0a3161; --muted: #5f5d57; --line: #dbd9d4; --line2: #cfccc4;
  --gold: #cd931e; --gold-ink: #8b6414; --gold-soft: #faf4e9; --on: #0a3161; --on-ink: #ffffff;
  --out: #b31942; --out-soft: #f7e8ec; --ok: #1c6b43; --ok-soft: #e8f0ec; --shade: rgb(10 49 97 / .42);
  --serif: "Instrument Serif", "Iowan Old Style", Georgia, serif;
  --sans: "Segoe UI Variable Text", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #08182f; --card: #0f2442; --ink: #eef2f8; --muted: #a8b3c4; --line: #1f3657; --line2: #2c4770;
  --gold: #e0ab3e; --gold-ink: #f0c56a; --gold-soft: #2a2414; --on: #e0ab3e; --on-ink: #0a1d38;
  --out: #ff8fa6; --out-soft: #3a1622; --ok: #7fd1a8; --ok-soft: #12301f; --shade: rgb(0 0 0 / .55); color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #08182f; --card: #0f2442; --ink: #eef2f8; --muted: #a8b3c4; --line: #1f3657; --line2: #2c4770;
  --gold: #e0ab3e; --gold-ink: #f0c56a; --gold-soft: #2a2414; --on: #e0ab3e; --on-ink: #0a1d38;
  --out: #ff8fa6; --out-soft: #3a1622; --ok: #7fd1a8; --ok-soft: #12301f; --shade: rgb(0 0 0 / .55); color-scheme: dark }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 16px; line-height: 1.45; }
button, select, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; border-radius: 8px; }
h1, h2 { font-family: var(--serif); margin: 0; font-weight: 400; text-wrap: balance; letter-spacing: -.005em; }
.brand { display: flex; gap: 14px; align-items: center; }
#logo-slot img { width: 64px; height: 64px; object-fit: contain; display: block; }
#logo-slot:empty { display: none; }
.addlogo { position: relative; width: 64px; height: 64px; border-radius: 50%; border: 2px dashed var(--gold); display: grid; place-items: center; text-align: center; font-size: 11px; font-weight: 800; color: var(--gold-ink); line-height: 1.1; padding: 6px; cursor: pointer; }
.addlogo input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
h1 em { font-style: italic; color: var(--out); }
p { margin: 0; }
.wrap { max-width: 560px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* prototype strip */
.strip { background: #0a3161; color: #fff; border-bottom: 3px solid #b31942; font-size: 13px; }
.strip .wrap { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; padding-block: 7px; }
.strip select { background: transparent; color: inherit; border: 1px solid currentColor; border-radius: 8px; padding: 2px 6px; min-height: 32px; opacity: .95; }
.strip select option { color: #14213d; background: #fff; }
.strip button { background: none; border: 0; color: inherit; text-decoration: underline; font-weight: 700; min-height: 32px; padding: 0; }
.strip .grow { flex: 1; }

/* header */
header { padding-block: 22px 8px; display: grid; gap: 2px; }
.eyebrow { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--gold-ink); font-weight: 800; }
h1 { font-size: 34px; line-height: 1.05; }
.tabs { display: flex; gap: 4px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 4px; margin-top: 14px; }
.tabs button { flex: 1; min-height: 40px; font-size: 14px; padding: 0 4px; border: 0; border-radius: 9px; background: transparent; font-weight: 700; color: var(--muted); }
.tabs button[aria-selected="true"] { background: var(--on); color: var(--on-ink); }

/* month */
.monthbar { display: flex; align-items: center; justify-content: space-between; margin: 18px 0 8px; }
.monthbar h2 { font-size: 24px; }
.icon { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line2); background: var(--card); font-size: 20px; line-height: 1; }
.grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 2px; text-align: center; }
.grid .wd { font-size: 11px; font-weight: 700; color: var(--muted); padding-bottom: 4px; letter-spacing: .04em; }
.day { height: 44px; border: 0; background: transparent; border-radius: 10px; display: grid; place-items: center; align-content: center; gap: 3px; font-size: 14px; font-variant-numeric: tabular-nums; padding: 0; }
.day[disabled] { cursor: default; }
.day.has { font-weight: 700; }
.day.has:hover { background: var(--gold-soft); }
.day.today span:first-child { border-bottom: 2px solid var(--gold); }
.day .dots { display: flex; gap: 3px; height: 5px; }
.day .dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--ok); }
.day .dots i.mine { background: var(--out); }
.day .dots i.talk { background: var(--ok); }
.day .dots .cnt { font-size: 10px; line-height: 6px; color: var(--out); font-weight: 800; }
.day.has span:first-child { color: var(--ink); }
.day.missday span:first-child { color: var(--out); }
.day.sel { background: var(--on); color: var(--on-ink); }
.day.sel .dots i { background: var(--on-ink); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 12px; color: var(--muted); margin-top: 6px; }
.legend i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--ok); margin-right: 5px; vertical-align: 0; }
.legend i.mine { background: var(--out); }
.legend i.talk { background: var(--ok); }

/* list */
.list { margin: 18px 0 40px; display: grid; gap: 8px; }
.listhead { display: flex; justify-content: space-between; align-items: baseline; margin-top: 18px; }

.ev { display: grid; grid-template-columns: 48px minmax(0, 1fr) auto; gap: 12px; align-items: center; width: 100%; text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; }
.ev:hover { border-color: var(--gold); }
.ev.past { opacity: .62; }
.ev.hl { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold); }
.datechip { text-align: center; line-height: 1.05; border-right: 1px solid var(--line); padding-right: 10px; }
.datechip b { display: block; font-family: var(--serif); font-size: 26px; font-weight: 400; }
.datechip span { font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 700; }

.tag { font-size: 12px; font-weight: 700; border-radius: 999px; padding: 3px 9px; white-space: nowrap; border: 1px solid transparent; }
.tag.out { background: var(--out-soft); color: var(--out); }
.tag.ok { background: var(--ok-soft); color: var(--ok); }
.tag.n { background: var(--gold-soft); color: var(--gold-ink); }
.tag.q { color: var(--muted); border-color: var(--line2); }

/* sheet */
.scrim { position: fixed; inset: 0; background: var(--shade); z-index: 40; display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--card); width: 100%; max-width: 560px; max-height: 86%; overflow-y: auto; border-radius: 22px 22px 0 0; padding: 8px 20px calc(20px + env(safe-area-inset-bottom, 0px)); }
@media (min-width: 640px) { .scrim { align-items: center; } .sheet { border-radius: 22px; } }
.grab { width: 40px; height: 4px; border-radius: 4px; background: var(--line2); margin: 4px auto 12px; }
.sheet .top { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
.sheet h2 { font-size: 26px; line-height: 1.15; }
.x { flex: none; width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--bg); font-size: 20px; color: var(--muted); }
.facts { margin: 10px 0 16px; display: grid; gap: 2px; font-size: 14px; color: var(--muted); }
.facts b { color: var(--ink); font-weight: 600; }
.cta { width: 100%; min-height: 52px; border-radius: 14px; border: 0; background: var(--on); color: var(--on-ink); font-weight: 800; font-size: 17px; }
.cta[disabled] { opacity: .5; }

.status { border-radius: 14px; padding: 12px 14px; display: flex; align-items: center; gap: 12px; justify-content: space-between; margin-bottom: 10px; }
.status.out { background: var(--out-soft); color: var(--out); }
.status.ok { background: var(--ok-soft); color: var(--ok); }
.status button { background: var(--card); color: var(--ink); border: 1px solid var(--line2); border-radius: 10px; min-height: 40px; padding: 0 14px; font-weight: 700; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 12px; }
.chip { min-height: 40px; border-radius: 999px; padding: 6px 14px; border: 1px solid var(--line2); background: var(--card); font-size: 14px; font-weight: 600; }
.chip[aria-checked="true"] { background: var(--on); color: var(--on-ink); border-color: var(--on); }
.label { font-size: 13px; font-weight: 700; color: var(--muted); margin: 6px 0 4px; }
.who { display: grid; gap: 6px; margin: 4px 0 14px; }
.whorow { display: flex; align-items: center; gap: 10px; font-size: 15px; }
.whorow .nm { flex: 1; min-width: 0; }
.whorow .nm small { display: block; color: var(--muted); font-size: 12px; }
.whorow button { border: 1px solid var(--line2); background: var(--card); border-radius: 10px; min-height: 36px; padding: 0 10px; font-size: 13px; font-weight: 700; }
.av { width: 32px; height: 32px; border-radius: 50%; flex: none; display: inline-grid; place-items: center; background: var(--gold-soft); color: var(--ink); font-family: var(--serif); font-weight: 700; font-size: 12px; border: 1px solid var(--line); object-fit: cover; }
.av.lg { width: 56px; height: 56px; font-size: 18px; }
.note { font-size: 12px; color: var(--muted); margin-top: 10px; }
select.f, input.f, textarea.f { width: 100%; min-height: 44px; border: 1px solid var(--line2); border-radius: 12px; padding: 9px 12px; background: var(--card); }
textarea.f { min-height: 140px; font-size: 14px; }

/* report */
.summary { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin: 16px 0; }
.summary div { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px; }
.summary b { display: block; font-family: var(--serif); font-size: 26px; font-variant-numeric: tabular-nums; line-height: 1.1; }
.summary span { font-size: 12px; color: var(--muted); }
.rrow { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.rrow:last-child { border-bottom: 0; }
.rrow .d { font-size: 12px; color: var(--muted); }
.rrow .n { font-family: var(--serif); font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; min-width: 28px; text-align: right; }
.rrow .n.zero { color: var(--muted); font-weight: 400; }
.panel { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 4px 14px; }
.actions { display: flex; gap: 8px; margin: 14px 0 40px; }
.actions .ghost { flex: 1; }
.updates { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 10px 14px; margin-top: 14px; }
.updates h3 { font-size: 14px; margin: 0 0 4px; font-family: var(--sans); display: flex; justify-content: space-between; align-items: center; }
.upd { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; font-size: 13px; padding: 5px 0; border-top: 1px solid var(--line); }
.upd:first-of-type { border-top: 0; }
.upd small { color: var(--muted); white-space: nowrap; }
.staffbar { display: flex; gap: 8px; margin-top: 14px; }
.staffbar .ghost { flex: 1; min-height: 44px; }
.ev.canceled .t { text-decoration: line-through; }
.seg { display: flex; gap: 4px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 3px; }
.seg button { border: 0; background: transparent; border-radius: 8px; min-height: 36px; padding: 0 12px; font-weight: 700; font-size: 14px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--on); color: var(--on-ink); }
.ytable { overflow-x: auto; background: var(--card); border: 1px solid var(--line); border-radius: 16px; }
.ytable table { border-collapse: collapse; width: 100%; font-size: 14px; }
.ytable th, .ytable td { padding: 9px 7px; border-bottom: 1px solid var(--line); text-align: center; font-variant-numeric: tabular-nums; white-space: nowrap; }
.ytable th { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.ytable td:first-child, .ytable th:first-child { text-align: left; position: sticky; left: 0; background: var(--card); }
.ytable td.z { color: var(--muted); opacity: .55; }
.pl { color: var(--gold-ink); font-weight: 700; font-size: 12px; margin-left: 3px; }
.ytable td.pl2 { color: var(--gold-ink); }
.ytable td.tot { font-weight: 800; font-family: var(--serif); font-size: 17px; }
.ytable tr:last-child td { border-bottom: 0; }
.ytable button { background: none; border: 0; padding: 0; font-weight: 700; display: flex; gap: 8px; align-items: center; text-align: left; }
.diff { display: grid; gap: 6px; margin: 4px 0 14px; }
.diff .whorow { align-items: flex-start; }
.whoami { display: flex; align-items: center; gap: 10px; margin-top: 14px; background: var(--card); border: 1.5px solid var(--gold); border-radius: 14px; padding: 6px 6px 6px 14px; }
.whoami span { font-size: 13px; font-weight: 700; color: var(--muted); white-space: nowrap; }
.whoami select { flex: 1; min-width: 0; min-height: 40px; border: 0; background: var(--gold-soft); border-radius: 10px; padding: 0 10px; font-weight: 800; font-size: 16px; color: var(--ink); }
.role { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 14px; }
.role button { min-height: 46px; border-radius: 12px; border: 1.5px solid var(--line2); background: var(--card); font-weight: 800; font-size: 15px; color: var(--muted); }
.role button[aria-pressed="true"] { border-color: var(--gold); background: var(--gold-soft); color: var(--ink); }
.tabs { margin-top: 10px; }
footer { text-align: center; font-size: 12px; color: var(--muted); padding-bottom: 40px; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); z-index: 60; background: #0a3161; color: #fff; border-radius: 14px; padding: 8px 8px 8px 16px; display: flex; gap: 12px; align-items: center; width: min(420px, calc(100% - 32px)); box-shadow: 0 8px 30px rgb(0 0 0 / .3); font-size: 15px; }
.toast button { background: rgb(255 255 255 / .15); color: #fff; border: 1px solid rgb(255 255 255 / .45); border-radius: 10px; min-height: 38px; padding: 0 12px; font-weight: 700; }
.drawer .item { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; display: grid; gap: 4px; font-size: 14px; }
.drawer .item small { color: var(--muted); font-size: 12px; }
.drawer .item .a { display: flex; gap: 12px; }
.drawer .item .a button { background: none; border: 0; padding: 0; text-decoration: underline; font-size: 12px; font-weight: 700; min-height: 28px; }
@media (prefers-reduced-motion: no-preference) { .sheet { animation: up .18s ease-out; } @keyframes up { from { transform: translateY(24px) } to { transform: none } } }
</style>

<script>
const SCHEDULE_TEXT = __SCHEDULE__;

/* ---------- reading the staff schedule (same format staff send) */
const MONTHS = { January:1, February:2, March:3, April:4, May:5, June:6, July:7, August:8, September:9, October:10, November:11, December:12 };
const pad2 = (n) => String(n).padStart(2, "0");
function to24(t) { const m = t.trim().toLowerCase().match(/^(\d{1,2})(?::(\d{2}))?\s*([ap]m)$/); if (!m) return null; let h = +m[1] % 12; if (m[3] === "pm") h += 12; return pad2(h) + ":" + (m[2] || "00"); }
function parseSchedule(text) {
  const out = []; let dates = null, ev = null, prevRaw = "";
  const dateRe = /^(?:Mon|Tues|Wednes|Thurs|Fri|Satur|Sun)day(?:\s*-\s*\w+day)?,\s+([A-Z][a-z]+)\s+(\d{1,2})(?:\s*-\s*(\d{1,2}))?,\s+(\d{4})$/;
  const timeRe = /^(?:(\d{1,2}(?::\d{2})?\s*[ap]m)\s*-\s*(\d{1,2}(?::\d{2})?\s*[ap]m)|(all day))\s*:?\s*(.+)$/i;
  for (const raw of text.split(/\r?\n/)) {
    const line = raw.trim(); if (!line) continue;
    let m = line.match(dateRe);
    if (m && MONTHS[m[1]]) { const y = m[4], mo = pad2(MONTHS[m[1]]); dates = { start: `${y}-${mo}-${pad2(m[2])}`, end: m[3] ? `${y}-${mo}-${pad2(m[3])}` : null }; ev = null; continue; }
    m = line.match(timeRe);
    if (m && dates) { prevRaw = raw; ev = { date: dates.start, endDate: dates.end, allDay: !!m[3], start: m[3] ? null : to24(m[1]), end: m[3] ? null : to24(m[2]), title: m[4].trim(), roles: [], audience: "", location: "" }; out.push(ev); continue; }
    if (!ev) continue;
    m = line.match(/^(Presiding Fellow|Chair|Secretary|Moderator|Host)\s*:\s*(.+)$/i);
    if (m) { ev.roles.push([m[1], m[2].trim()]); continue; }
    if (/^White House Fellows/i.test(line)) { ev.audience = line; continue; }
    if (!ev.audience) { ev.title += (/^\t/.test(raw) || !/\s$/.test(prevRaw) ? " · " : " ") + line; prevRaw = raw; continue; } // wrapped line (previous ends in a space) or a second item
    if (!ev.location) ev.location = line;
  }
  for (const e of out) {
    const t = e.title.toLowerCase(), a = e.audience.toLowerCase();
    e.title = e.title.replace(/\s+/g, " ").trim();
    e.kind = /meeting/.test(t) ? "Meeting" : /conference|luncheon/.test(t) ? "Conference" : /bowling|dinner|reception/.test(t) || /spouse/.test(a) ? "Social" : /tour|session|101/.test(t) ? "Program session" : "Speaker Series";
    e.optional = e.kind === "Social" || e.allDay;
    e.key = e.date + "|" + (e.start || "allday") + "|" + e.title.toLowerCase().slice(0, 40);
  }
  return out;
}

/* ---------- helpers */
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const WD = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"], MN = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const MONTHNAME = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const dObj = (k) => { const [y, m, d] = k.split("-").map(Number); return new Date(Date.UTC(y, m - 1, d, 12)); };
const fmtD = (k) => { const d = dObj(k); return `${WD[d.getUTCDay()]}, ${MN[d.getUTCMonth()]} ${d.getUTCDate()}`; };
const fmtLong = (k) => dObj(k).toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric", timeZone: "UTC" });
const fmtT = (t) => { if (!t) return ""; let [h, m] = t.split(":").map(Number); const ap = h >= 12 ? "PM" : "AM"; h = h % 12 || 12; return m ? `${h}:${pad2(m)} ${ap}` : `${h} ${ap}`; };
const when = (e) => e.allDay ? "All day" : `${fmtT(e.start)} – ${fmtT(e.end)}`;
const shortLoc = (l) => (l || "").replace(/Eisenhower Executive Office Building,?\s*(EEOB\s*[–-]?\s*)?/, "EEOB ").trim();
const REASONS = ["Military training/duty", "Placement work obligation", "Illness", "Personal/family", "Travel", "Other"];

/* ---------- people (placeholders unless staff add names/photos) */

    if (!fid || !it || !it.at) return; const k = fid + "|" + eid;
    if (!latest[k] || latest[k].at < it.at) latest[k] = { ...it, src };
    const ev = EVENTS.find((x) => x.id === eid); const nm = (fx(fid) || {}).name || "A Fellow"; const dt = ev ? fmtD(ev.date).slice(5) : "an event";
    hist.push({ at: it.at, text: it.kind === "absent" ? `${src === "staff" ? "Program staff marked " + nm + " absent" : nm + " will miss"} ${dt} (${it.reason || "no reason"})` : it.kind === "attended" ? `Program staff marked ${nm} as attended ${dt}` : `${src === "staff" ? "Program staff removed " + nm + "'s absence for" : nm + " removed their absence for"} ${dt}` });

const tkey = (e) => e.title.toLowerCase().replace(/[^a-z0-9]+/g, " ").trim().slice(0, 28);
function diffSchedule(found) {
  const months = new Set(found.map((e) => e.date.slice(0, 7)));
  const pool = EVENTS.filter((e) => !e.canceled && months.has(e.date.slice(0, 7)));
  const used = new Set(), added = [], changed = [], same = [];
  for (const n of found) {
    const m = pool.find((e) => !used.has(e.id) && tkey(e) === tkey(n));
    if (!m) { added.push(n); continue; }
    used.add(m.id);
    const what = [];
    if (m.date !== n.date) what.push(`moved ${fmtD(m.date).slice(5)} → ${fmtD(n.date).slice(5)}`);
    if (m.start !== n.start || m.end !== n.end) what.push(`time ${when(m)} → ${when(n)}`);
    if ((m.location || "") !== (n.location || "")) what.push(`room → ${n.location || "none"}`);
    if (what.length) changed.push({ old: m, n, what }); else same.push(m);
  }
  const removed = pool.filter((e) => !used.has(e.id));
  return { added, changed, removed, same, months: [...months] };
}

/* read a .docx in the browser (no upload to any server) */
async function readZipEntry(buf, wanted) {
  const v = new DataView(buf); let eocd = -1;
  for (let i = buf.byteLength - 22; i >= Math.max(0, buf.byteLength - 70000); i--) if (v.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
  if (eocd < 0) throw new Error("not a zip");
  const count = v.getUint16(eocd + 10, true); let p = v.getUint32(eocd + 16, true);
  for (let n = 0; n < count; n++) {
    if (v.getUint32(p, true) !== 0x02014b50) break;
    const method = v.getUint16(p + 10, true), csize = v.getUint32(p + 20, true), nlen = v.getUint16(p + 28, true), elen = v.getUint16(p + 30, true), clen = v.getUint16(p + 32, true), loff = v.getUint32(p + 42, true);
    const name = new TextDecoder().decode(new Uint8Array(buf, p + 46, nlen));
    if (name === wanted) {
      const start = loff + 30 + v.getUint16(loff + 26, true) + v.getUint16(loff + 28, true);
      const data = new Uint8Array(buf, start, csize);
      if (method === 0) return new TextDecoder().decode(data);
      const ds = new Blob([data]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
      return await new Response(ds).text();
    }
    p += 46 + nlen + elen + clen;
  }
  throw new Error("no document");
}
async function docxToText(file) {
  const xml = await readZipEntry(await file.arrayBuffer(), "word/document.xml");
  const doc = new DOMParser().parseFromString(xml, "application/xml");
  const W = "http://schemas.openxmlformats.org/wordprocessingml/2006/main";
  const lines = [];
  for (const para of doc.getElementsByTagNameNS(W, "p")) {
    let t = "";
    const walk = (node) => { for (const c of node.childNodes) { if (c.namespaceURI === W && c.localName === "t") t += c.textContent; else if (c.namespaceURI === W && c.localName === "tab") t += "\t"; else if (c.namespaceURI === W && c.localName === "br") t += "\n"; else if (c.nodeType === 1 && c.localName !== "p") walk(c); } };
    walk(para); lines.push(t);
  }
  return lines.join("\n");
}

/* .ics download (times converted from Eastern) */
function etToUtc(date, time) {
  const [y, mo, d] = date.split("-").map(Number), [h, mi] = (time || "00:00").split(":").map(Number);
  const wall = Date.UTC(y, mo - 1, d, h, mi);
  const off = (ms) => { const p = Object.fromEntries(new Intl.DateTimeFormat("en-US", { timeZone: "America/New_York", hourCycle: "h23", year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit" }).formatToParts(new Date(ms)).map((x) => [x.type, x.value])); return Date.UTC(+p.year, +p.month - 1, +p.day, +p.hour, +p.minute) - ms; };
  let g = wall - off(wall); g = wall - off(g); return new Date(g);
}

function buildIcs() {
  const lines = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Fellows Attendance//Speaker Series//EN", "CALSCALE:GREGORIAN", "X-WR-CALNAME:Speaker Series"];
  for (const e of sorted().filter((x) => !x.canceled)) {
    lines.push("BEGIN:VEVENT", `UID:${e.date}-${tkey(e).replace(/\s/g, "-")}@fellows-attendance`, `DTSTAMP:${icsStamp(new Date())}`);
    if (e.allDay) { const nd = new Date(Date.UTC(+e.date.slice(0, 4), +e.date.slice(5, 7) - 1, +e.date.slice(8) + 1)); lines.push(`DTSTART;VALUE=DATE:${e.date.replace(/-/g, "")}`, `DTEND;VALUE=DATE:${nd.toISOString().slice(0, 10).replace(/-/g, "")}`); }
    else lines.push(`DTSTART:${icsStamp(etToUtc(e.date, e.start))}`, `DTEND:${icsStamp(etToUtc(e.date, e.end || e.start))}`);
    lines.push(`SUMMARY:${icsEsc(e.title)}`);
    if (e.location) lines.push(`LOCATION:${icsEsc(e.location)}`);
    if (e.roles.length) lines.push(`DESCRIPTION:${icsEsc(e.roles.map(([r, n]) => r + ": " + n).join("\n"))}`);
    lines.push("END:VEVENT");
  }

      const { rows } = reportData(); const q = (x) => `"${String(x).replace(/"/g, '""').replace(/^([=+\-@])/, "'$1")}"`;
      const list = rFellow ? rows.filter((r) => r.f.id === rFellow) : rows;
      const ms = rMode === "year" ? monthsWithEvents() : [];
      const head = ["Fellow", "Missed", "Planned", ...ms.map((m) => MONTHNAME[+m.slice(5) - 1] + " " + m.slice(0, 4)), ...REASONS, "Dates and reasons"];
      const csv = [head.map(q).join(",")].concat(list.map((r) => { const t = Object.fromEntries(tallyReasons(r.missed)); return [q(r.f.name), r.missed.length, r.planned.length, ...ms.map((m) => r.missed.concat(r.planned).filter((x) => x.e.date.startsWith(m)).length), ...REASONS.map((x) => t[x] || 0), q(r.missed.map((m) => `${m.e.date} ${m.e.title} (${m.reason}${(ABS[r.f.id + "|" + m.e.id] || {}).note ? ": " + ABS[r.f.id + "|" + m.e.id].note : ""})`).join("; "))].join(","); })).join("\r\n") + "\r\n";
      if (!dl) { toast("Download isn't available in this view. Try “Copy for email”."); break; }
      try { await dl.save({ filename: `speaker-series-attendance-${periodSlug()}.csv`, data: new Blob([csv], { type: "text/csv" }) }); } catch { toast("Download canceled."); }
      break; }
    case "copy": {
      const { rows } = reportData(); const list = rFellow ? rows.filter((r) => r.f.id === rFellow) : rows;
      const txt = `Speaker Series attendance, ${periodLabel()}\n\n` + list.map((r) => `${r.f.name}: ${r.missed.length} absence${r.missed.length === 1 ? "" : "s"}${rMonth === "all" && r.missed.length ? " (" + monthsWithEvents().map((m) => mShort(m) + " " + r.missed.filter((x) => x.e.date.startsWith(m)).length).join(", ") + ")" : ""}${r.missed.length ? "\n" + r.missed.map((m) => `  - ${fmtD(m.e.date)}: ${m.e.title} (${m.reason})`).join("\n") : ""}`).join("\n");
      try { await navigator.clipboard.writeText(txt); toast("Copied. Paste it into an email."); } catch { toast("Couldn't copy here. Try the spreadsheet instead."); }
      break; }
    case "toastundo": if (window._undo) window._undo(); document.getElementById("toast").innerHTML = ""; break;
    case "savefb": {
      const ta = document.getElementById("fb-text"), st = document.getElementById("fb-status"), text = ta.value.trim();
      if (!text) { st.textContent = "Write something first."; return; }
      t.disabled = true; st.textContent = "Sending…";
      try { await db.collection("feedback").add({ screen: document.getElementById("fb-on").value, kind: "note", text: text.slice(0, 4000), by: myId, at: new Date().toISOString(), resolved: false, design: "simple-v2", viewingAs: AS }); ta.value = ""; fbMsg = "✓ Sent. Thank you."; renderSheet(); }
      catch { t.disabled = false; st.textContent = "Not sent. Please try again."; }
      break; }
    case "fbdone": try { await db.doc("feedback/" + d.n).update({ resolved: d.v === "1" }); } catch {} break;
    case "fbdel": try { await db.doc("feedback/" + d.n).delete(); } catch {} break;
    case "savename": { const v = document.getElementById("nm-" + d.f).value.trim(); rmsg[d.f] = "Saving…"; renderSheet();
      try { await saveRoster(d.f, { name: v }); rmsg[d.f] = "✓ Saved"; } catch { rmsg[d.f] = "Not saved"; } renderSheet(); break; }
  }
});
document.addEventListener("change", async (ev) => {
  const id = ev.target.id;
  if (id === "as-sel") { AS = ev.target.value; try { localStorage.setItem("fa-who", AS); } catch {} sheet = null; selDay = null; tab = "cal"; rFellow = ""; render(); }

  if (id === "r-month") { rMonth = ev.target.value; render(); }
  if (id === "r-day") { rDay = ev.target.value; render(); }
  if (id === "r-fellow") { rFellow = ev.target.value; render(); }
  if (id === "up-month") { upMonth = ev.target.value; render(); }
  if (id === "up-doc" && ev.target.files[0]) {
    const file = ev.target.files[0]; upMsg = "Reading " + file.name + "…"; render();
    try {
      const text = /\.docx$/i.test(file.name) ? await docxToText(file) : await file.text();
      const found = parseSchedule(text);
      if (!found.length) { upMsg = "No events found in " + file.name + ". Is it the usual schedule format?"; render(); return; }
      upMsg = ""; pasteText = text; pasteSample = ""; pasteDiff = diffSchedule(found); sheet = { type: "paste" }; render();
    } catch { upMsg = "Couldn't read that file. Try a .docx or paste the text instead."; render(); }
    return;
  }
  if (id === "fb-on") { fbFor = ev.target.value; renderSheet(); }
  if (id === "pick-logo" && ev.target.files[0] && assetsCap && db) {
    const file = ev.target.files[0]; logoMsg = "Uploading…"; renderSheet();
    try { const up = await assetsCap.upload(file); const old = brand.logo; await db.doc("brand/main").set({ logo: up.id, at: new Date().toISOString() }); if (old) assetsCap.delete(old).catch(() => {}); logoMsg = "✓ Logo saved"; }
    catch (e) { logoMsg = e && e.code === "unsupported_type" ? "Use a PNG, JPEG, WebP or SVG file." : "Logo not saved. Try again."; }
    renderSheet(); render(); if (/saved/.test(logoMsg)) toast("Logo added"); else if (logoMsg !== "Uploading…") toast(logoMsg); return;
  }
  if (id === "pick-folder" || id === "pick-files") {
    const files = [...ev.target.files].filter((f) => (/^image\//.test(f.type) || /\.(jpe?g|png|heic|webp)$/i.test(f.name)) && !/logo/i.test(f.name)).sort((a, b) => a.name.localeCompare(b.name));
    if (!files.length) { toast("No photos found there."); return; }
    folder = files.map((file) => ({ file, url: URL.createObjectURL(file), name: nameFromFile(file.name) })); folderMsg = ""; renderSheet(); return;
  }
  const fid = ev.target.dataset && ev.target.dataset.photo;
  if (fid && ev.target.files[0] && assetsCap) {
    rmsg[fid] = "Uploading…"; renderSheet();
    try { const up = await assetsCap.upload(await squareJpeg(ev.target.files[0])); const old = (roster[fid] || {}).photo; await saveRoster(fid, { photo: up.id }); if (old) assetsCap.delete(old).catch(() => {}); rmsg[fid] = "✓ Photo saved"; }
    catch (e) { rmsg[fid] = e && e.message === "bad image" ? "Use a JPEG or PNG" : "Photo not saved"; }
    renderSheet();
  }
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && sheet) { sheet = null; renderSheet(); } });
document.getElementById("fb-btn").addEventListener("click", () => { fbFor = curKey(); fbMsg = ""; sheet = { type: "feedback" }; renderSheet(); });

/* boot */
try { const w = localStorage.getItem("fa-who"); if (w === "staff" || /^f\d+$/.test(w || "")) AS = w; } catch {}
NOW = (window.__NOW || etNow()); month = NOW.slice(0, 7);
setInterval(() => { NOW = window.__NOW || etNow(); }, 60000);
seed(); render(); initCaps();
</script>
