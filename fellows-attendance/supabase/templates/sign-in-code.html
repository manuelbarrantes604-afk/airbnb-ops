<div style="font-family: -apple-system, Segoe UI, Helvetica, Arial, sans-serif; color:#14213D; max-width:480px; margin:0 auto; padding:24px;">
  <h2 style="font-weight:600; margin:0 0 12px;">Your sign-in code</h2>
  <p style="margin:0 0 16px; line-height:1.5;">Enter this code in the Fellows Attendance app to sign in. It expires in 1 hour.</p>
  <p style="font-size:32px; letter-spacing:8px; font-weight:700; background:#FBF9F4; border:1px solid #E7DFC9; border-radius:12px; padding:16px; text-align:center; margin:0 0 16px;">{{ .Token }}</p>
  <p style="margin:0; color:#5B6478; font-size:13px; line-height:1.5;">If you did not try to sign in, you can ignore this email. Never share this code.</p>
</div>
