<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f5f2">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<title>Mis limpiezas</title>
<style>
  :root {
    --bg: #f6f5f2; --card: #ffffff; --ink: #1c1c1e; --ink2: #3a3a3c; --muted: #6e6e73; --line: #e7e5e0; --soft: #efeee9;
    --open: #ff5a5f; --open-ink: #d93a40; --open-soft: #ffeceb;
    --mine: #12a150; --mine-ink: #0b7a3b; --mine-soft: #e3f5ea;
    --cov: #a9a7a1; --cov-soft: #eeede8;
    --res: #7c4dd6; --res-ink: #5b33a8; --res-soft: #efe8fc;
    --turn: #b45309; --turn-soft: #fff3df;
    --blue: #2563eb; --blue-soft: #e8efff;
    --danger: #d92d20; --danger-soft: #fdecea;
    --r: 20px; --shadow: 0 1px 2px rgba(20,20,20,.04), 0 6px 20px rgba(20,20,20,.06);
    --safe-b: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body { font: 17px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased; min-height: 100vh; overscroll-behavior-y: contain; }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; padding: 0; }
  a { color: inherit; }
  [hidden] { display: none !important; }
  .wrap { max-width: 520px; margin: 0 auto; padding: 0 16px calc(96px + var(--safe-b)); }
  .top { position: sticky; top: 0; z-index: 20; background: rgba(246,245,242,.97); box-shadow: 0 1px 0 rgba(0,0,0,.04); backdrop-filter: saturate(1.4) blur(14px);
    -webkit-backdrop-filter: saturate(1.4) blur(14px); padding: calc(env(safe-area-inset-top, 0px) + 14px) 16px 10px; }
  .top-in { max-width: 520px; margin: 0 auto; display: flex; align-items: center; gap: 12px; }
  .avatar { width: 44px; height: 44px; border-radius: 50%; background: linear-gradient(135deg, #ff8a7a, #ff5a5f); color: #fff;
    display: grid; place-items: center; font-weight: 750; font-size: 19px; flex: none; box-shadow: 0 4px 12px rgba(255,90,95,.3); }
  .hi { font-size: 22px; font-weight: 750; letter-spacing: -.02em; line-height: 1.15; }
  .subhi { font-size: 14px; color: var(--muted); }
  .lang { margin-left: auto; height: 36px; padding: 0 4px; border-radius: 999px; background: var(--card); box-shadow: var(--shadow);
    display: flex; align-items: center; font-size: 13px; font-weight: 700; }
  .lang span { padding: 6px 10px; border-radius: 999px; color: var(--muted); }
  .lang span.on { background: var(--ink); color: #fff; }
  .offline { max-width: 520px; margin: 6px auto 0; background: #fff6e0; color: #7a4b00; border: 1px solid #f4dca4; border-radius: 14px; padding: 10px 14px; font-size: 14px; }
  h2.sec { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 700; margin: 26px 4px 10px; }
  .card { background: var(--card); border-radius: var(--r); box-shadow: var(--shadow); }
  .hero { margin-top: 8px; padding: 18px; display: flex; gap: 14px; align-items: center; width: 100%; text-align: left;
    background: linear-gradient(135deg, #0f9a4c, #12a150 60%, #2bb866); color: #fff; border-radius: var(--r); box-shadow: 0 10px 24px rgba(18,161,80,.25); }
  .hero .k { font-size: 13px; opacity: .9; font-weight: 650; text-transform: uppercase; letter-spacing: .05em; }
  .hero .t { font-size: 22px; font-weight: 750; letter-spacing: -.01em; margin-top: 2px; }
  .hero .s { font-size: 15px; opacity: .95; margin-top: 2px; }
  .hero .chev { margin-left: auto; font-size: 26px; opacity: .9; }
  .hero-date { width: 62px; height: 66px; border-radius: 16px; background: rgba(255,255,255,.18); display: grid; place-items: center; text-align: center; flex: none; line-height: 1.05; }
  .hero-date b { font-size: 26px; display: block; }
  .hero-date small { font-size: 12px; text-transform: uppercase; font-weight: 700; opacity: .95; }
  .hero.empty { background: var(--card); color: var(--ink); box-shadow: var(--shadow); }
  .hero.empty .k { color: var(--muted); }
  .callout { margin-top: 12px; display: flex; gap: 12px; align-items: center; padding: 14px 16px; border-radius: 16px; width: 100%; text-align: left;
    background: var(--open-soft); color: var(--open-ink); font-weight: 650; font-size: 16px; }
  .callout .n { min-width: 36px; height: 36px; border-radius: 12px; background: var(--open); color: #fff; display: grid; place-items: center; font-weight: 800; font-size: 18px; padding: 0 8px; }
  .callout .go { margin-left: auto; font-size: 22px; }
  .cal { margin-top: 14px; padding: 14px 10px 12px; touch-action: pan-y; user-select: none; }
  .cal-head { display: flex; align-items: center; justify-content: space-between; padding: 0 4px 10px; }
  .cal-head h3 { margin: 0; font-size: 20px; font-weight: 750; letter-spacing: -.01em; }
  .navb { width: 44px; height: 44px; border-radius: 50%; background: var(--soft); display: grid; place-items: center; font-size: 22px; font-weight: 600; }
  .navb:disabled { opacity: .35; }
  .dows, .days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .dows div { text-align: center; font-size: 12px; font-weight: 700; color: var(--muted); padding: 2px 0 6px; }
  .day { position: relative; height: 58px; border-radius: 14px; display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    padding-top: 7px; font-size: 16px; font-weight: 600; color: var(--ink2); }
  .day.other { visibility: hidden; }
  .day.past { color: #c2c0ba; }
  .day.today .num { box-shadow: 0 0 0 2px var(--ink); }
  .day .num { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; }
  .day .lbl { font-size: 10.5px; font-weight: 750; margin-top: 3px; letter-spacing: .01em; white-space: nowrap; }
  .day.k-open { background: var(--open); color: #fff; box-shadow: 0 4px 12px rgba(255,90,95,.35); }
  .day.k-open .num { background: rgba(255,255,255,.2); }
  .day.k-open.today .num { box-shadow: 0 0 0 2px #fff; }
  .day.k-mine { background: var(--mine-soft); color: var(--mine-ink); }
  .day.k-mine .num { background: var(--mine); color: #fff; }
  .day.k-cov { background: var(--cov-soft); color: #8b8984; }
  .day.k-res { background: var(--res-soft); color: var(--res-ink); box-shadow: inset 0 0 0 1.5px #c9b5f2; }
  .day.k-res .num { background: var(--res); color: #fff; }
  .dots i.r { background: var(--res); }
  .row.k-reserved { background: #faf7ff; box-shadow: inset 0 0 0 1.5px #ddd0f7; }
  .row.k-reserved .dblock { background: var(--res-soft); color: var(--res-ink); }
  .chip.res { background: var(--res-soft); color: var(--res-ink); }
  .day.k-past-mine { background: var(--mine-soft); color: var(--mine-ink); opacity: .6; }
  .day .dots { position: absolute; top: 5px; right: 6px; display: flex; gap: 2px; }
  .day .dots i { width: 6px; height: 6px; border-radius: 50%; }
  .dots i.o { background: var(--open); } .day.k-open .dots i.o { background: #fff; } .dots i.m { background: var(--mine); } .dots i.c { background: var(--cov); }
  .day.sel { outline: 3px solid var(--ink); outline-offset: 1px; }
  .day:active { transform: scale(.96); }
  .legend { display: flex; justify-content: center; gap: 16px; flex-wrap: wrap; padding: 12px 4px 2px; font-size: 13px; color: var(--muted); font-weight: 600; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i { width: 12px; height: 12px; border-radius: 4px; display: inline-block; }
  .swipe-hint { text-align: center; font-size: 12px; color: #a3a19b; margin-top: 4px; }
  @keyframes slideL { from { transform: translateX(24px); opacity: .2 } to { transform: none; opacity: 1 } }
  @keyframes slideR { from { transform: translateX(-24px); opacity: .2 } to { transform: none; opacity: 1 } }
  .days.anim-l { animation: slideL .22s ease-out; } .days.anim-r { animation: slideR .22s ease-out; }
  .list { display: flex; flex-direction: column; gap: 10px; }
  .row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; width: 100%; text-align: left; background: var(--card);
    border-radius: 18px; box-shadow: var(--shadow); min-height: 72px; }
  .row:active { transform: scale(.99); }
  .dblock { width: 52px; height: 56px; border-radius: 14px; display: grid; place-items: center; text-align: center; line-height: 1.05; flex: none; background: var(--soft); color: var(--ink2); }
  .dblock small { font-size: 11px; font-weight: 750; text-transform: uppercase; letter-spacing: .03em; }
  .dblock b { font-size: 22px; font-weight: 800; display: block; }
  .row.k-open .dblock { background: var(--open-soft); color: var(--open-ink); }
  .row.k-mine .dblock { background: var(--mine-soft); color: var(--mine-ink); }
  .row.k-covered { box-shadow: none; background: transparent; border: 1px dashed #dad8d2; min-height: 60px; }
  .row.k-covered .dblock { background: var(--cov-soft); color: #8b8984; height: 46px; }
  .rmain { flex: 1; min-width: 0; }
  .rt { font-weight: 700; font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rs { font-size: 14px; color: var(--muted); margin-top: 1px; }
  .row.k-covered .rt { color: #8b8984; font-weight: 600; font-size: 15px; }
  .chip { display: inline-flex; align-items: center; gap: 4px; font-size: 12.5px; font-weight: 750; padding: 5px 10px; border-radius: 999px; white-space: nowrap; }
  .chip.open { background: var(--open); color: #fff; }
  .chip.mine { background: var(--mine-soft); color: var(--mine-ink); }
  .chip.cov { background: var(--cov-soft); color: #7d7b76; }
  .chip.turn { background: var(--turn-soft); color: var(--turn); }
  .chip.when { background: var(--blue-soft); color: var(--blue); }
  .chip.falta { background: #fff1d6; color: #8a5300; }
  .chip.pend { background: var(--blue-soft); color: var(--blue); }
  .chip.paid { background: var(--mine-soft); color: var(--mine-ink); }
  .take { padding: 10px 14px; border-radius: 12px; background: var(--open); color: #fff; font-weight: 750; font-size: 15px; flex: none; }
  .jcard { padding: 16px; }
  .jcard + .jcard { margin-top: 12px; }
  .jtop { display: flex; gap: 14px; align-items: flex-start; }
  .jtop .dblock { width: 60px; height: 66px; background: var(--mine-soft); color: var(--mine-ink); }
  .jtop .dblock b { font-size: 26px; }
  .jt { font-size: 19px; font-weight: 750; letter-spacing: -.01em; }
  .js { font-size: 15px; color: var(--muted); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .facts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 14px; }
  .fact { background: var(--soft); border-radius: 14px; padding: 10px 12px; }
  .fact small { display: block; font-size: 12px; color: var(--muted); font-weight: 650; }
  .fact b { font-size: 16px; font-weight: 700; }
  .turnbox { margin-top: 12px; background: var(--turn-soft); color: #7c3a06; border-radius: 14px; padding: 11px 13px; font-size: 15px; font-weight: 600; display: flex; gap: 10px; }
  .acts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
  .btn { display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; border-radius: 16px; font-weight: 700; font-size: 16px;
    background: var(--soft); color: var(--ink); text-decoration: none; padding: 0 14px; text-align: center; }
  .btn:active { transform: scale(.98); }
  .btn.primary { background: var(--open); color: #fff; box-shadow: 0 6px 16px rgba(255,90,95,.35); }
  .btn.green { background: var(--mine); color: #fff; box-shadow: 0 6px 16px rgba(18,161,80,.3); }
  .btn.dark { background: var(--ink); color: #fff; }
  .btn.ghost-danger { background: transparent; color: var(--danger); border: 1.5px solid #f3c2bd; }
  .btn.danger { background: var(--danger); color: #fff; }
  .btn.big { min-height: 60px; font-size: 18px; border-radius: 18px; width: 100%; }
  .btn.full { width: 100%; grid-column: 1 / -1; }
  .btn[disabled] { opacity: .5; pointer-events: none; }
  .link-btn { color: var(--muted); font-size: 15px; font-weight: 600; text-decoration: underline; padding: 12px; display: block; margin: 4px auto 0; }
  .empty { text-align: center; padding: 34px 20px; }
  .empty .em { font-size: 44px; }
  .empty h3 { margin: 10px 0 4px; font-size: 19px; }
  .empty p { margin: 0 0 16px; color: var(--muted); font-size: 15px; }
  .paysum { padding: 18px; }
  .paysum .m { font-size: 14px; color: var(--muted); font-weight: 650; }
  .paysum .big { font-size: 38px; font-weight: 800; letter-spacing: -.02em; margin-top: 2px; }
  .paygrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
  .paygrid .fact b { font-size: 20px; }
  .howpay { padding: 16px; margin-top: 12px; }
  .howpay ol { margin: 8px 0 12px; padding-left: 22px; color: var(--ink2); font-size: 15px; }
  .howpay li { margin: 4px 0; }
  .cash { display: flex; align-items: center; gap: 10px; background: #e9f9ee; border-radius: 14px; padding: 10px 12px; }
  .cash .tag { font-weight: 800; font-size: 18px; color: #00a344; flex: 1; text-align: left; }
  .cash button { background: #00c244; color: #fff; padding: 9px 14px; border-radius: 12px; font-weight: 750; font-size: 14px; }
  .prow { display: flex; align-items: center; gap: 12px; padding: 14px; }
  .prow + .prow { border-top: 1px solid var(--line); }
  .prow .amt { font-weight: 800; font-size: 17px; text-align: right; }
  .prow .amt small { display: block; font-size: 12px; color: var(--muted); font-weight: 600; }
  .mini { padding: 9px 12px; border-radius: 12px; background: var(--ink); color: #fff; font-weight: 700; font-size: 14px; flex: none; }
  .tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: rgba(255,255,255,.985); backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px); border-top: 1px solid var(--line); padding: 6px 8px calc(6px + var(--safe-b)); }
  .tabbar-in { max-width: 520px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); }
  .tb { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 0; font-size: 12px; font-weight: 700; color: #8e8e93; position: relative; min-height: 54px; }
  .tb svg { width: 26px; height: 26px; }
  .tb.on { color: var(--ink); }
  .tb .badge { position: absolute; top: 2px; left: calc(50% + 8px); min-width: 19px; height: 19px; border-radius: 10px; background: var(--open); color: #fff; font-size: 11px; display: grid; place-items: center; padding: 0 5px; font-weight: 800; font-style: normal; }
  .sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.36); opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 40; }
  .sheet-bg.open { opacity: 1; pointer-events: auto; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 41; background: var(--bg); border-radius: 26px 26px 0 0; max-height: 92vh;
    overflow-y: auto; transform: translateY(105%); transition: transform .28s cubic-bezier(.2,.8,.2,1); padding: 8px 16px calc(20px + var(--safe-b));
    max-width: 560px; margin: 0 auto; -webkit-overflow-scrolling: touch; }
  .sheet.open { transform: none; }
  .grab { width: 40px; height: 5px; border-radius: 3px; background: #d4d2cc; margin: 4px auto 10px; }
  .sh-x { position: absolute; right: 14px; top: 12px; width: 36px; height: 36px; border-radius: 50%; background: var(--soft); font-size: 16px; color: var(--muted); }
  /* CLOSE-SKIP 2026-10-10: close bar pinned to the top of the sheet so it never scrolls away */
  .sh-bar { position: sticky; top: -8px; z-index: 3; display: flex; align-items: center; justify-content: space-between; gap: 8px;
    margin: -8px -16px 6px; padding: 10px 12px 8px; background: var(--bg); border-radius: 26px 26px 0 0; }
  .sh-bar .grab { position: absolute; left: 50%; top: 4px; margin: 0; transform: translateX(-50%); }
  .sh-back { display: inline-flex; align-items: center; gap: 4px; min-height: 44px; padding: 0 14px 0 8px; border-radius: 22px; background: var(--card); box-shadow: var(--shadow);
    font-size: 16px; font-weight: 700; color: var(--ink); }
  .sh-back b { font-size: 22px; line-height: 1; }
  .sh-bar .sh-x { position: static; width: 44px; height: 44px; font-size: 18px; color: var(--ink); background: var(--card); box-shadow: var(--shadow); }
  .ostep { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 10px 0 4px; }
  .ostep .cnt { font-size: 14px; color: var(--muted); font-weight: 650; }
  .ostep button { min-height: 44px; padding: 0 14px; border-radius: 22px; background: var(--card); box-shadow: var(--shadow); font-weight: 700; font-size: 15px; color: var(--ink); }
  .ostep button[disabled] { opacity: .35; }
  .btn.skip { background: var(--card); color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--line), var(--shadow); margin-top: 10px; }
  .sh-title { font-size: 24px; font-weight: 800; letter-spacing: -.02em; margin: 6px 44px 4px 2px; line-height: 1.15; }
  .sh-sub { font-size: 16px; color: var(--muted); margin: 0 2px 14px; }
  .sh-card { background: var(--card); border-radius: var(--r); box-shadow: var(--shadow); padding: 16px; margin-bottom: 12px; }
  .kv { display: flex; gap: 12px; align-items: flex-start; padding: 10px 0; }
  .kv + .kv { border-top: 1px solid var(--line); }
  .kv .ic { width: 34px; height: 34px; border-radius: 10px; background: var(--soft); display: grid; place-items: center; font-size: 17px; flex: none; }
  .kv .v { font-weight: 650; font-size: 16px; }
  .kv .v small { display: block; color: var(--muted); font-weight: 500; font-size: 14px; }
  .confirm-q { font-size: 20px; font-weight: 750; text-align: center; margin: 6px 6px 16px; line-height: 1.3; }
  .done { text-align: center; padding: 18px 8px 8px; }
  .done .ok { width: 84px; height: 84px; border-radius: 50%; background: var(--mine); color: #fff; display: grid; place-items: center; margin: 0 auto;
    font-size: 44px; animation: pop .35s cubic-bezier(.2,1.4,.4,1); box-shadow: 0 10px 24px rgba(18,161,80,.35); }
  .done .ok.warn { background: var(--open); box-shadow: 0 10px 24px rgba(255,90,95,.35); }
  .done h3 { font-size: 24px; margin: 16px 0 6px; letter-spacing: -.01em; }
  .done p { color: var(--muted); margin: 0 0 18px; font-size: 16px; }
  @keyframes pop { from { transform: scale(.4); opacity: 0 } to { transform: none; opacity: 1 } }
  .warnbox { background: var(--danger-soft); color: #8f1d14; border-radius: 16px; padding: 13px 14px; font-size: 15px; font-weight: 600; margin-bottom: 12px; display: flex; gap: 10px; }
  .reasons { display: flex; flex-wrap: wrap; gap: 8px; margin: 4px 0 12px; }
  .reasons button { padding: 11px 14px; border-radius: 999px; background: var(--card); box-shadow: inset 0 0 0 1.5px var(--line); font-weight: 650; font-size: 15px; }
  .reasons button.on { background: var(--ink); color: #fff; box-shadow: none; }
  textarea, input.in { width: 100%; border: 1.5px solid var(--line); border-radius: 14px; padding: 13px 14px; font: inherit; background: #fff; color: var(--ink); }
  textarea:focus, input.in:focus { outline: none; border-color: var(--ink); }
  label.lb { display: block; font-size: 14px; font-weight: 700; color: var(--muted); margin: 14px 2px 6px; }
  .stepper { display: flex; align-items: center; gap: 10px; }
  .stepper button { width: 56px; height: 56px; border-radius: 16px; background: var(--card); box-shadow: inset 0 0 0 1.5px var(--line); font-size: 26px; font-weight: 600; }
  .stepper .val { flex: 1; text-align: center; font-size: 30px; font-weight: 800; }
  .stepper .val small { font-size: 15px; color: var(--muted); font-weight: 650; margin-left: 4px; }
  .money-in { position: relative; }
  .money-in span { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); font-size: 26px; font-weight: 800; color: var(--muted); }
  .money-in input { font-size: 28px; font-weight: 800; padding-left: 38px; height: 62px; }
  .preview { text-align: center; color: var(--muted); font-size: 15px; margin: 12px 0; }
  .preview b { color: var(--ink); }
  .check { display: flex; gap: 12px; align-items: flex-start; padding: 12px 2px; width: 100%; text-align: left; }
  .check + .check { border-top: 1px solid var(--line); }
  .check .bx { width: 28px; height: 28px; border-radius: 9px; border: 2px solid #cfcdc7; flex: none; display: grid; place-items: center; color: #fff; font-size: 16px; font-weight: 800; }
  .check.on .bx { background: var(--mine); border-color: var(--mine); }

      if (on) { b.classList.add('on'); ta.value = (ta.value && !pre.includes(ta.value)) ? b.dataset.reason + '. ' + ta.value : b.dataset.reason; }
      else if (pre.includes(ta.value)) ta.value = '';
    });
  }
  function go(tab) { if (sheet.classList.contains('open')) closeSheet(); S.tab = tab; S.sel = null; render(); window.scrollTo(0, 0); }
  $$('.tb').forEach(b => b.onclick = () => go(b.dataset.tab));
  $('#langBtn').onclick = () => { lang = lang === 'es' ? 'en' : 'es'; store.set('portal-lang', lang); sheet.classList.remove('open'); sheetBg.classList.remove('open'); render(); };
  const q = (new URLSearchParams(location.search).get('tab') || location.hash.slice(1));
  if (['cal', 'mine', 'pay', 'perf'].includes(q)) S.tab = q;
  window.__portal = { S, render, jobSheet, daySheet, cancelSheet, invSheet, acceptConfirm, go, nav, tasksSheet, paySheet, notMeSheet };
  if (LOGIN_MODE) {
    const mf0 = document.createElement('link'); mf0.rel = 'manifest'; mf0.href = 'manifest.json'; document.head.appendChild(mf0);
    bootLogin(); return;
  }
  if (!TOKEN) { fatal('🔗', t('badLink'), t('badLinkSub')); return; }
  load(true);
  setInterval(() => { if (document.visibilityState === 'visible' && !S.busy && !sheet.classList.contains('open')) load(false); }, 30000);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && !sheet.classList.contains('open')) load(false); });
  
  const mf = document.createElement('link'); mf.rel = 'manifest'; mf.href = URL.createObjectURL(new Blob([JSON.stringify({name:'Mis limpiezas · Manuel',short_name:'Limpiezas',start_url:location.origin+location.pathname+'?t='+TOKEN+'&login=1',scope:location.origin+location.pathname,display:'standalone',background_color:'#f6f5f2',theme_color:'#f6f5f2',lang:'es',icons:[{src:location.origin+location.pathname+'icon-192.png',sizes:'192x192',type:'image/png'},{src:location.origin+location.pathname+'icon-512.png',sizes:'512x512',type:'image/png'}]})],{type:'application/manifest+json'})); document.head.appendChild(mf);
})();
</script>
