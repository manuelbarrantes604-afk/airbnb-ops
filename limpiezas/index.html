<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Limpiezas</title>
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0f9a86">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Limpiezas">
<meta name="application-name" content="Limpiezas">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root { --red:#0f9a86; --ink:#1d1d1f; --muted:#6e6e73; --bg:#ffffff; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--ink);
    font:16px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    overflow:hidden; -webkit-text-size-adjust:100%; }
  #wrapX { position:fixed; left:0; right:0; top:env(safe-area-inset-top, 0px);
    bottom:env(safe-area-inset-bottom, 0px); }
  #board { position:absolute; inset:0; width:100%; height:100%; border:0; display:block; background:var(--bg); }
  #overlay { position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    background:var(--bg); z-index:10; padding:24px; text-align:center; transition:opacity .25s; }
  #overlay.hidden { opacity:0; pointer-events:none; }
  .card { max-width:340px; }
  .logo { width:76px; height:76px; border-radius:18px; box-shadow:0 6px 20px rgba(15,154,134,.28); }
  h1 { font-size:21px; margin:18px 0 6px; font-weight:650; }
  p { margin:0 0 6px; color:var(--muted); font-size:15px; }
  .spin { width:26px; height:26px; margin:18px auto 4px; border-radius:50%;
    border:3px solid #bfe8e0; border-top-color:var(--red); animation:spin .9s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .btns { margin-top:18px; display:flex; flex-direction:column; gap:10px; }
  .btn { display:block; padding:13px 16px; border-radius:12px; font-weight:600; font-size:16px;
    text-decoration:none; border:0; cursor:pointer; }
  .btn.primary { background:var(--red); color:#fff; }
  .btn.ghost { background:#f2f2f4; color:var(--ink); }
  .btn[hidden] { display:none; }
  .small { font-size:12.5px; color:#9a9aa0; margin-top:14px; }
  #toast { position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom, 0px) + 84px);
    transform:translateX(-50%) translateY(20px); background:rgba(29,29,31,.92); color:#fff;
    padding:9px 16px; border-radius:20px; font-size:14px; opacity:0; transition:all .3s; z-index:20; pointer-events:none; }
  #toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div id="overlay" role="status" aria-live="polite">
  <div class="card">
    <img class="logo" src="icon-192.png" alt="">
    <h1 id="title">Abriendo… <span style="color:var(--muted);font-weight:500">/ Opening…</span></h1>
    <p id="msg">Abriendo tus limpiezas.<br>Opening your cleaning calendar.</p>
    <div class="spin" id="spin"></div>
    <div class="btns">
      <button class="btn primary" id="retry" hidden>Reintentar / Retry</button>
      <a class="btn ghost" id="direct" hidden>Abrir directo / Open directly</a>
    </div>
    <div class="small" id="status"></div>
  </div>
</div>
<script>
(function () {
  'use strict';
  // 2026-10-10: NO iframe. Resolve the live board URL from url.json, then navigate the whole page there
  // (top-level, same-tab). Cross-origin iframes failed on phones (ITP / blocked tunnel hosts → endless spinner).
  var OWNER = 'manuelbarrantes604-afk', REPO = 'airbnb-ops', BRANCH = 'main';
  var LS_KEY = 'airbnb-ops-permalink-last', CLEANER_KEY = 'limpiezas-token';
  var TOKEN_RE = /^[A-Za-z0-9_-]{10,64}$/;
  var FALLBACK = 'https://airbnb-ops.tail3ff34f.ts.net';   // backup only (Tailscale Funnel)
  var $ = function (id) { return document.getElementById(id); };

  function lsGet(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

  var qs = new URLSearchParams(location.search);
  var tok = qs.get('t') || '';
  if (!tok) { var m = (qs.get('p') || '').match(/^\/c\/([A-Za-z0-9_-]{10,64})/); if (m) tok = m[1]; }
  if (TOKEN_RE.test(tok)) lsSet(CLEANER_KEY, tok);          // personal link → remember this device
  if (qs.get('out') === '1') { try { localStorage.removeItem(CLEANER_KEY); } catch (e) {} }

  function route() {
    if (TOKEN_RE.test(tok)) return '/c/' + tok;
    if (qs.get('out') === '1') return '/c/?out=1';
    var r = lsGet(CLEANER_KEY);
    if (TOKEN_RE.test(r)) return '/c/' + r + '?login=1';
    return '/c/';
  }
  function target(base) { return base.replace(/\/+$/, '') + route(); }
  function validUrl(u) { return typeof u === 'string' && /^https:\/\/[A-Za-z0-9.-]+(:\d+)?\/?$/.test(u.trim()); }

  function fetchCfg(src) {
    return new Promise(function (resolve) {
      var done = false, t = setTimeout(function () { if (!done) { done = true; resolve(null); } }, 6000);
      fetch(src + (src.indexOf('?') < 0 ? '?' : '&') + 't=' + Date.now(), { cache: 'no-store' })
        .then(function (r) { if (!r.ok) throw 0; return r.json(); })
        .then(function (j) {
          if (done) return; done = true; clearTimeout(t);
          resolve(j && validUrl(j.url) ? { url: j.url.trim().replace(/\/+$/, ''), updated: Date.parse(j.updated) || 0 } : null);
        })
        .catch(function () { if (!done) { done = true; clearTimeout(t); resolve(null); } });
    });
  }

  function fail() {
    $('spin').style.display = 'none';
    $('title').innerHTML = 'No se pudo abrir <span style="color:var(--muted);font-weight:500">/ Could not open</span>';
    $('msg').innerHTML = 'Revisa tu internet y toca Reintentar.<br>Check your connection and tap Retry.';
    $('retry').hidden = false;
    var last = null; try { last = JSON.parse(lsGet(LS_KEY) || 'null'); } catch (e) {}
    $('direct').href = target(last && validUrl(last.url) ? last.url : FALLBACK);
    $('direct').hidden = false;
  }

  function go() {
    $('retry').hidden = true; $('direct').hidden = true; $('spin').style.display = '';
    $('status').textContent = '';
    Promise.all([
      fetchCfg('../url.json'),
      fetchCfg('https://raw.githubusercontent.com/' + OWNER + '/' + REPO + '/' + BRANCH + '/url.json')
    ]).then(function (list) {
      var best = null;
      list.forEach(function (c) { if (c && (!best || c.updated > best.updated)) best = c; });
      if (!best) return fail();
      lsSet(LS_KEY, JSON.stringify(best));
      var dest = target(best.url);
      $('direct').href = dest;
      location.replace(dest);
      // If the browser hasn't left within 8 s, offer manual buttons instead of spinning forever.
      setTimeout(function () { $('status').textContent = 'Si no abre, toca "Abrir directo". / If it does not open, tap Open directly.'; $('direct').hidden = false; $('retry').hidden = false; }, 8000);
    }, fail);
  }
  $('retry').onclick = go;
  go();
})();
</script>
</body>
</html>
